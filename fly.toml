# fly.toml app configuration file generated for bot-tele-qzhkvg12 on 2026-11-10T18:55:02Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'bot-tele-qzhkvg12'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[processes]
  app = 'python main.py'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
